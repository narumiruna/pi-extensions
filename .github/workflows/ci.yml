name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      test-base:
        description: Base revision for affected tests
        required: false
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Validate installation policy
        run: node scripts/check-install-policy.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run affected tests
        env:
          PI_EXTENSIONS_TEST_BASE: ${{ inputs.test-base || github.event.pull_request.base.sha || github.event.before }}
        run: npm test
