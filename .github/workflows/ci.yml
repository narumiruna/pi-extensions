name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      test-base:
        description: Base revision for affected tests
        required: false
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run affected tests
        env:
          PI_EXTENSIONS_BUILD_READY: "1"
          PI_EXTENSIONS_TEST_BASE: ${{ inputs.test-base || github.event.pull_request.base.sha || github.event.before }}
        run: npm test
