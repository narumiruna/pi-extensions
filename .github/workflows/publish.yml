name: Version or publish packages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create version PR or publish packages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Check out source revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create version pull request or publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          version-script: npm run version-packages
          publish-script: npm run publish-packages:sequential
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: true
          push-with-git-cli: false
        env:
          NPM_CONFIG_PROVENANCE: "true"
          PUBLISH_FAILURES_FILE: ${{ runner.temp }}/package-publish-failures.ndjson
          PUBLISHED_PACKAGES_FILE: ${{ runner.temp }}/published-packages.ndjson

      - name: Summarize published packages
        if: always()
        env:
          PUBLISHED_PACKAGES_FILE: ${{ runner.temp }}/published-packages.ndjson
        run: |
          if [[ ! -s "$PUBLISHED_PACKAGES_FILE" ]]; then
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const releases = readFileSync(process.env.PUBLISHED_PACKAGES_FILE, "utf8")
            .trim()
            .split("\n")
            .map((line) => JSON.parse(line));
          const rows = releases.map(
            (release) => `| \`${release.packageName}\` | \`${release.version}\` |`,
          );
          const summary = [
            "## Successfully published packages",
            "",
            "| Package | Version |",
            "| --- | --- |",
            ...rows,
            "",
          ].join("\n");

          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Fail after package publication errors
        if: steps.changesets.outcome == 'success'
        env:
          PUBLISH_FAILURES_FILE: ${{ runner.temp }}/package-publish-failures.ndjson
        run: |
          if [[ -s "$PUBLISH_FAILURES_FILE" ]]; then
            echo "::error::One or more packages failed to publish or were skipped."
            exit 1
          fi
